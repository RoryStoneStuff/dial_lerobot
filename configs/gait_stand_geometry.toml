# DIAL and costs from co_design/humanoid_codesign, using LeRobot PPO physics.
[robot]
timestep = 0.02
control_mode = "torque"
solver_iterations = 100
ls_iterations = 50
soft_joint_limit_factor = 0.9
initial_clearance = 0.0

[mpc]
plan_horizon = 0.4
num_knots = 5
num_samples = 2048
noise_level = 0.3
temperature = 0.05
beta_opt_iter = 1.0
beta_horizon = 0.9
iterations = 1
spline_type = "zero"
control_decimation = 1

[cost]
target_vx = 0.0
target_vy = 0.0
ramp_up_time = 2.0
gait_weight = 5.0
ref_tracking_weight = 3.0
velocity_weight = 4.0
upright_weight = 5.0
height_weight = 1.0
hip_lateral_weight = 6.0
contact_weight = 0.05
yaw_weight = 0.1
angular_velocity_weight = 1.0
com_support_weight = 1.0
com_support_margin = 0.01
com_support_scale = 0.1
energy_weight = 0.01
unhealthy_penalty = 10.0
duty = 0.50
cadence = 1.0
swing_height = 0.0
hip_amplitude = 0.0
knee_amplitude = 0.0
qstand_hip = -0.1
qstand_knee = -0.05
source_rest_height = 0.85
source_healthy_z_min = 0.6
healthy_up_dot = 0.8
terminal_height_weight = 5.0
terminal_velocity_weight = 2.0
terminal_upright_weight = 10.0
# rest_height and healthy_z_min are inferred from the current morphology.

[evaluation]
episode_steps = 300
num_episodes = 2
height_jitter = 0.02
seed = 0

[design]
sigma0 = 0.05
lower_bounds = [0.05, 0.05, 0.1]
upper_bounds = [0.4, 0.4, 8.0]
maxiter = 80
popsize = 12
seed = 42
