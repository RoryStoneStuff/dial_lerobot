# First locomotion-tuning variant: preserve the baseline target and gait,
# but prioritize velocity tracking over exact joint-reference tracking.
[robot]
timestep = 0.010
solver_iterations = 100
ls_iterations = 50
soft_joint_limit_factor = 0.9
initial_clearance = 0.03

[mpc]
plan_horizon = 0.2
num_knots = 4
num_samples = 64
noise_level = 0.3
temperature = 0.5
beta_opt_iter = 1.0
beta_horizon = 1.0
iterations = 1
spline_type = "zero"
control_decimation = 1

[cost]
target_vx = 0.5
target_vy = 0.0
ramp_up_time = 2.0
gait_weight = 5.0
ref_tracking_weight = 1.0
velocity_weight = 8.0
upright_weight = 5.0
height_weight = 1.0
hip_lateral_weight = 6.0
unhealthy_penalty = 100.0
duty = 0.55
cadence = 1.0
swing_height = 0.06
hip_amplitude = 0.6
knee_amplitude = 0.9
qstand_hip = -0.20
qstand_knee = 0.40
source_rest_height = 0.85
source_healthy_z_min = 0.6
healthy_up_dot = 0.8
terminal_height_weight = 5.0
terminal_velocity_weight = 2.0
terminal_upright_weight = 10.0

[evaluation]
episode_steps = 300
num_episodes = 2
height_jitter = 0.02
seed = 0

[design]
sigma0 = 0.05
lower_bounds = [0.05, 0.05, 0.1]
upper_bounds = [0.4, 0.4, 8.0]
maxiter = 80
popsize = 12
seed = 42
