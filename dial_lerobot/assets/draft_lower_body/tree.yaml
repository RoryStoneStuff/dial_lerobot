                          link_mass_class: foot
                          motor_axis: z
                          motor_class: ${ankle_roll_mot}
                          motor_for: ankle_roll
                        children:
                          - name: right_foot
                            type: foot
                            pos: [0, -0.01594, 0.02]
                            euler: [1.5707963267948966, 0.0, -1.5707963267948966]
                            joint: {name: right_anklex, axis: z, range: [-0.1745329252, 0.1745329252], motor_class: "${ankle_roll_mot}"}
                            geometry:
                              foot_l: ${foot_length}
                              foot_w: ${foot_width}
                              foot_h: ${foot_h}
                              foot_plate_h: ${foot_plate_h}
                              foot_offset_x: ${foot_offset_x}
                              foot_rho: ${foot_rho}
