                euler: [1.6447991046846135, 0.4267326038517365, -2.7246144280949105]
                joint: {name: right_hipy, axis: z, range: [-1.0471975512, 1.0471975512], motor_class: "${hip_pitch_mot}"}
                geometry:
                  link_axis: y
                  link_l: ${upper_leg_link_length}
                  link_mass_class: thigh
                  motor_axis: z
                  motor_class: ${knee_mot}
                  motor_for: knee
                children:
                  - name: right_shin_link
                    type: basic
                    pos:
                      - "${0.17 * upper_leg_link_length / 0.34136558643337206}"
                      - "${0.294449 * upper_leg_link_length / 0.34136558643337206}"
                      - "${-0.0305 * upper_leg_link_length / 0.34136558643337206}"
                    euler: [3.1415926535895458, 0.0, 0.5444389932228546]
                    joint: {name: right_knee, axis: z, range: [-0.6, 0.15], motor_class: "${knee_mot}"}
                    geometry:
                      link_axis: -x
                      link_l: ${lower_leg_link_length}
